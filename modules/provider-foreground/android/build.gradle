plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.providerforeground'
version = '0.1.0'

android {
  namespace "expo.modules.providerforeground"
  defaultConfig {
    minSdkVersion 24
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // NotificationCompat + foreground-service helpers.
  implementation "androidx.core:core-ktx:1.13.1"
}
